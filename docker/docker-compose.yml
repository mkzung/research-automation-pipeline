services:
  runner:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: research-runner
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # Read-only dataset mount (provide your own datasets here)
      - ./datasets:/app/datasets:ro
      # Writeable output mount
      - ./output:/app/output
    environment:
      - PORT=5000
      - DATASETS_DIR=/app/datasets
      - OUTPUT_DIR=/app/output
      - RUN_TIMEOUT_S=300
    # Resource limits — defense in depth for sandboxing
    mem_limit: 1g
    cpus: 1.0

  # Optional: self-hosted n8n for orchestration. Uncomment + set N8N_BASIC_AUTH_PASSWORD before using.
